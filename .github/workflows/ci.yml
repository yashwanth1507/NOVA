name: Nova CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# The project lives in the Nova/ subdirectory of the repository, so every
# command must run there.  Without this the dependency install, compile check
# and pytest collection all target paths that do not exist at the repo root.
defaults:
  run:
    working-directory: Nova

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx

    - name: Validate Python Compilation
      run: |
        python -m compileall -q Nova main.py

    - name: Set up Node.js for frontend validation
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Validate JavaScript Syntax
      run: |
        node --check Nova/frontend/desktop/static/app.js

    - name: Run Pytest Test Suite
      run: |
        pytest -v
